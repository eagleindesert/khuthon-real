services:
  # ── PostgreSQL DB ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine          # 경량 Alpine 기반 PostgreSQL 16
    container_name: khuthon-db
    environment:
      POSTGRES_DB: khuthondb           # 생성할 데이터베이스 이름
      POSTGRES_USER: postgres          # 슈퍼유저 계정
      POSTGRES_PASSWORD: postgres      # 슈퍼유저 비밀번호
    ports:
      - "5432:5432"                    # 로컬에서 DB 클라이언트로 직접 접속 가능
    volumes:
      - postgres_data:/var/lib/postgresql/data  # 컨테이너 재시작 후에도 데이터 유지
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # 최초 기동 시 자동 실행
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]  # DB가 준비됐는지 확인
      interval: 10s    # 10초마다 확인
      timeout: 5s      # 5초 안에 응답 없으면 실패로 간주
      retries: 5       # 5번 실패하면 unhealthy 상태

  # ── Spring Boot App ────────────────────────────────────────────
  app:
    image: eagleindesert/khuthon-be:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khuthon-be
    ports:
      - "8080:8080"
    env_file:
      - .env                           # Spotify, YouTube 키 주입
    environment:
      DB_HOST: db                      # docker-compose 내부 서비스명으로 PostgreSQL 접근
      DB_PORT: 5432
      DB_NAME: khuthondb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis                # Redis 서비스명
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy     # DB가 완전히 준비된 후에 앱 시작
      redis:
        condition: service_healthy     # Redis가 준비된 후에 앱 시작
    restart: unless-stopped

  # ── Redis (세션 저장소) ─────────────────────────────────────
  redis:
    image: redis:7-alpine              # 경량 Alpine 기반 Redis 7
    container_name: khuthon-redis
    ports:
      - "6379:6379"                    # 로컬에서 redis-cli로 직접 접속 가능
    volumes:
      - redis_data:/data               # 재시작 후에도 세션 유지
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]  # Redis 준비 확인
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── pgAdmin 4 ──────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: khuthon-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@khuthon.com   # 로그인 이메일
      PGADMIN_DEFAULT_PASSWORD: admin            # 로그인 비밀번호
    ports:
      - "5050:80"                                # http://localhost:5050 으로 접속
    volumes:
      - pgadmin_data:/var/lib/pgadmin            # 설정/세션 영속 저장
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro  # DB 서버 자동 등록
    depends_on:
      db:
        condition: service_healthy               # DB 준비 후 pgAdmin 시작
    restart: unless-stopped

volumes:
  postgres_data:                       # 데이터 영속성을 위한 Named Volume
  pgadmin_data:                        # pgAdmin 설정 영속성을 위한 Named Volume
  redis_data:                          # Redis 세션 데이터 영속성을 위한 Named Volume
