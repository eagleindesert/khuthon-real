services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_PROXY_TARGET=http://backend:8080
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
